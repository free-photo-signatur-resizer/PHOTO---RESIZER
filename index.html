<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo & Signature Resizer | फोटो और हस्ताक्षर साइज़</title>
<meta name="description" content="Form ke liye photo aur signature ko 20KB, 50KB mein badlein. Free, Hindi + English, phone par. Photo upload nahi hoti.">
<style>
:root{--bg:#eef3f2;--card:#fff;--tx:#12202b;--mut:#51606b;--pri:#0e7c6b;--on:#fff;--bd:#cdd8d6;--hl:#f2b01e;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1517;--card:#162024;--tx:#eaf2f1;--mut:#9db0ae;--pri:#3cc4ad;--on:#06201b;--bd:#2a3a3d;--hl:#f2b01e;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Noto Sans Devanagari",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
h1{font-size:1.45rem;line-height:1.25;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.lang{flex:none;border:2px solid var(--pri);background:transparent;color:var(--pri);font:inherit;font-weight:700;border-radius:999px;padding:6px 14px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1 1 30%;min-height:48px;border:2px solid var(--bd);background:transparent;color:var(--tx);font:inherit;font-weight:600;border-radius:10px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--pri);background:var(--pri);color:var(--on)}
.file{display:block;border:2px dashed var(--pri);border-radius:12px;padding:22px 12px;text-align:center;font-weight:700;color:var(--pri);cursor:pointer}
.file input{display:none}
#fname{display:block;margin-top:8px;color:var(--mut);font-size:.9rem;word-break:break-all}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{display:block;font-size:.85rem;color:var(--mut)}
input[type=number]{width:100%;font:inherit;padding:10px;border:2px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.go{width:100%;min-height:54px;border:0;border-radius:12px;background:var(--hl);color:#1a1200;font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer}
.go:disabled{opacity:.6}
button:focus-visible,input:focus-visible,.file:focus-within{outline:3px solid var(--hl);outline-offset:2px}
#out{display:none;text-align:center}
#out img{max-width:100%;max-height:260px;border:1px solid var(--bd);border-radius:8px;background:#fff}
#info{font-weight:700;margin:10px 0}
#dl{display:inline-block;background:var(--pri);color:var(--on);text-decoration:none;font-weight:800;padding:14px 26px;border-radius:12px}
#msg{color:var(--err);font-weight:600;margin:10px 0 0}
.note{color:var(--mut);font-size:.88rem}
.priv{border-left:4px solid var(--pri);padding-left:10px;margin:0 0 14px;font-size:.92rem}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1 data-k="title"></h1>
    <p class="sub" data-k="sub"></p>
  </div>
  <button class="lang" id="lang" type="button">English</button>
</header>

<p class="priv" data-k="priv"></p>

<div class="card">
  <h2 data-k="s1"></h2>
  <div class="row" role="group">
    <button class="chip" type="button" data-p="photo" aria-pressed="true" data-k="photo"></button>
    <button class="chip" type="button" data-p="sign" aria-pressed="false" data-k="sign"></button>
    <button class="chip" type="button" data-p="custom" aria-pressed="false" data-k="custom"></button>
  </div>
</div>

<div class="card">
  <h2 data-k="s2"></h2>
  <label class="file">
    <span data-k="pick"></span>
    <input id="file" type="file" accept="image/*">
  </label>
  <span id="fname"></span>
</div>

<div class="card">
  <h2 data-k="s3"></h2>
  <div class="grid">
    <div><label for="w" data-k="w"></label><input id="w" type="number" inputmode="numeric" min="20" max="3000" value="200"></div>
    <div><label for="h" data-k="h"></label><input id="h" type="number" inputmode="numeric" min="20" max="3000" value="230"></div>
    <div><label for="kb" data-k="kb"></label><input id="kb" type="number" inputmode="numeric" min="5" max="2000" value="50"></div>
  </div>
  <p class="note" data-k="warn"></p>
  <button class="go" id="go" type="button" data-k="go"></button>
  <p id="msg" role="alert"></p>
</div>

<div class="card" id="out">
  <img id="prev" alt="">
  <div id="info"></div>
  <a id="dl" href="#" download="photo.jpg" data-k="dl"></a>
</div>

<p class="note" data-k="tip"></p>
</div>

<script>
var T={
hi:{title:"फोटो और हस्ताक्षर का साइज़ बदलें",sub:"फॉर्म की KB लिमिट में फोटो या सिग्नेचर — फ्री, फोन पर।",
priv:"आपकी फोटो कहीं अपलोड नहीं होती। सब कुछ आपके फोन में ही होता है।",
s1:"1. क्या चाहिए?",photo:"फोटो",sign:"हस्ताक्षर",custom:"अपना साइज़",
s2:"2. फोटो चुनें",pick:"📷 यहाँ दबाकर फोटो चुनें",
s3:"3. साइज़ भरें",w:"चौड़ाई (px)",h:"ऊँचाई (px)",kb:"अधिकतम KB",
warn:"ध्यान दें: हर परीक्षा का साइज़ अलग होता है। अपने फॉर्म की नोटिफिकेशन में लिखा साइज़ यहाँ भरें।",
go:"साइज़ बदलें",wait:"हो रहा है…",nofile:"पहले फोटो चुनें।",bad:"साइज़ के नंबर सही भरें।",
fail:"इस साइज़ में फोटो इतनी छोटी KB में नहीं आ सकती। चौड़ाई और ऊँचाई कम करके दोबारा करें।",
res:"नई फोटो",dl:"डाउनलोड करें",
tip:"सुझाव: फोटो सीधी लें, चेहरा बीच में रखें। हस्ताक्षर सफ़ेद कागज़ पर काली पेन से करें और साफ़ फोटो लें।"},
en:{title:"Resize Photo & Signature",sub:"Fit your photo or signature to the form's KB limit — free, on your phone.",
priv:"Your photo is never uploaded. Everything happens inside your phone.",
s1:"1. What do you need?",photo:"Photo",sign:"Signature",custom:"Custom",
s2:"2. Choose image",pick:"📷 Tap here to choose a photo",
s3:"3. Enter size",w:"Width (px)",h:"Height (px)",kb:"Max KB",
warn:"Note: every exam has its own size. Enter the size written in your form's notification.",
go:"Resize",wait:"Working…",nofile:"Choose a photo first.",bad:"Enter valid size numbers.",
fail:"Cannot fit this image under that KB at this size. Reduce width and height and try again.",
res:"New image",dl:"Download",
tip:"Tip: take the photo straight, face in the centre. Sign with a black pen on white paper and take a clear photo."}
};
var L="hi",cur="photo",file=null,last=null;
var P={photo:[200,230,50,"photo.jpg"],sign:[140,60,20,"signature.jpg"],custom:[300,300,100,"image.jpg"]};
var $=function(i){return document.getElementById(i)};

function render(){
  document.querySelectorAll("[data-k]").forEach(function(e){e.textContent=T[L][e.dataset.k]});
  document.documentElement.lang=L;
  $("lang").textContent=L==="hi"?"English":"हिंदी";
  if(last)showInfo();
}
function showInfo(){
  $("info").textContent=T[L].res+": "+last.kb+" KB · "+last.w+"×"+last.h+" px";
}
function setPreset(p){
  cur=p;
  document.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",c.dataset.p===p)});
  $("w").value=P[p][0];$("h").value=P[p][1];$("kb").value=P[p][2];
  $("dl").download=P[p][3];
}
document.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){setPreset(c.dataset.p)}});
$("lang").onclick=function(){L=L==="hi"?"en":"hi";render()};
$("file").onchange=function(e){file=e.target.files[0]||null;$("fname").textContent=file?file.name:"";$("msg").textContent=""};

function toBlob(cv,q){return new Promise(function(r){cv.toBlob(r,"image/jpeg",q)})}
function loadImg(f){return new Promise(function(ok,no){
  var im=new Image(),u=URL.createObjectURL(f);
  im.onload=function(){URL.revokeObjectURL(u);ok(im)};
  im.onerror=no;im.src=u;
})}

$("go").onclick=async function(){
  var msg=$("msg");msg.textContent="";
  if(!file){msg.textContent=T[L].nofile;return}
  var w=Math.round(+$("w").value),h=Math.round(+$("h").value),kb=+$("kb").value;
  if(!(w>=20&&h>=20&&kb>=5)){msg.textContent=T[L].bad;return}
  var btn=$("go");btn.disabled=true;btn.textContent=T[L].wait;
  try{
    var im=await loadImg(file);
    var cv=document.createElement("canvas");cv.width=w;cv.height=h;
    var cx=cv.getContext("2d");
    cx.fillStyle="#fff";cx.fillRect(0,0,w,h);
    var s=Math.max(w/im.naturalWidth,h/im.naturalHeight);
    var dw=im.naturalWidth*s,dh=im.naturalHeight*s;
    cx.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);
    var limit=kb*1024,lo=0.05,hi=0.95,best=null;
    var tiny=await toBlob(cv,lo);
    if(tiny.size>limit){msg.textContent=T[L].fail}
    else{
      best=tiny;
      for(var i=0;i<8;i++){
        var mid=(lo+hi)/2,b=await toBlob(cv,mid);
        if(b.size<=limit){best=b;lo=mid}else{hi=mid}
      }
      if(last&&last.url)URL.revokeObjectURL(last.url);
      var url=URL.createObjectURL(best);
      last={url:url,kb:(best.size/1024).toFixed(1),w:w,h:h};
      $("prev").src=url;$("dl").href=url;$("dl").download=P[cur][3];
      $("out").style.display="block";showInfo();
      $("out").scrollIntoView({behavior:"smooth"});
    }
  }catch(e){msg.textContent=T[L].fail}
  btn.disabled=false;btn.textContent=T[L].go;
};
render();
</script>
</body>
</html>
